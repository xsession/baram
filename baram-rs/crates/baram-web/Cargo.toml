[package]
name = "baram-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
baram-core = { path = "../baram-core" }
leptos      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
gloo-net    = "0.6"
gloo-timers = "0.3"
web-sys     = { version = "0.3", features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "Window",
    "Document",
    "Element",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "DomRectReadOnly",
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "CloseEvent",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys      = "0.3"
tracing     = { workspace = true }
console_error_panic_hook = "0.1"
